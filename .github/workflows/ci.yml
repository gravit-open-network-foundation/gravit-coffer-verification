name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git -c advice.detachedHead=false clone -q --depth 1 --branch v0.6.0 https://github.com/gravit-open-network-foundation/verifier.git .deps/verifier && pip install -e .deps/verifier pytest
      - name: Adversarial tests
        run: python -m pytest -q
      - name: Results are reproducible from the committed evidence (byte for byte, no network)
        run: |
          for d in evidence/*/; do if [ -f "$d/transactions.jsonl.gz" ]; then python -m coffer_verify.run verify "$(basename "$d")"; fi; done
          python -m coffer_verify.report > /dev/null
          git diff --exit-code results/ REPORT.md
